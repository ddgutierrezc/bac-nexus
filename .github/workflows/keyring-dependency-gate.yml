name: Keyring Dependency Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - .github/workflows/keyring-dependency-gate.yml

permissions:
  contents: read

jobs:
  evaluate:
    name: ${{ matrix.os }} keyring evaluation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify candidate module integrity
        run: |
          go mod download all
          go mod verify
          go list -m -json all

      - name: Compile supported targets without CGO
        shell: bash
        run: |
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go test -c github.com/zalando/go-keyring
            rm -f keyring.test keyring.test.exe
          done

      - name: Run upstream native keyring tests on this runner
        run: go test -count=1 github.com/zalando/go-keyring

      - name: Scan the candidate runtime package
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 github.com/zalando/go-keyring
