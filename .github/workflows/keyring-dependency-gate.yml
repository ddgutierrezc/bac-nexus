name: Keyring Dependency Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - .github/workflows/keyring-dependency-gate.yml
      - internal/credential/**

permissions:
  contents: read

jobs:
  evaluate:
    name: ${{ matrix.os }} keyring evaluation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify candidate module integrity
        run: |
          go mod download all
          go mod verify
          go list -m -json all

      - name: Compile supported targets without CGO
        shell: bash
        run: |
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go test -c github.com/zalando/go-keyring
            rm -f keyring.test keyring.test.exe
          done

      - name: Run upstream native keyring tests on this runner
        if: runner.os != 'Linux'
        run: go test -v -count=1 github.com/zalando/go-keyring

      - name: Run BAC Nexus credential package tests
        run: go test -v -count=1 ./internal/credential

      - name: Run Ubuntu deterministic native-unavailable contract test
        if: runner.os == 'Linux'
        run: |
          # Canonical reality: go-keyring on Linux needs an existing unlocked default Secret
          # Service collection. GitHub-hosted Ubuntu cannot deterministically create/unlock
          # one (headless GNOME Keyring requires an unavailable GUI prompt). This step proves
          # only that our adapter's fail-closed mapping is correct against the real
          # unavailable Secret Service and that no secrets leak; it is NOT a Linux success
          # claim and never runs upstream native tests.
          go test -v -count=1 -run TestNativeUnavailableMapsToCredentialsUnavailable ./internal/credential

      - name: Scan the candidate runtime package
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 github.com/zalando/go-keyring