name: Go Verification

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: go-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag format
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            exit 0
          fi
          release_tag="${GITHUB_REF_NAME}"
          release_tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          if [[ ! "${release_tag}" =~ ${release_tag_pattern} ]]; then
            echo "release tags must be SemVer: vMAJOR.MINOR.PATCH or a standard prerelease"
            exit 1
          fi

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run race-enabled tests
        run: go test -race ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Verify formatting and operator contract
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            diff="$(sed 's/\r$//' "$file" | gofmt -d)"
            if [[ -n "$diff" ]]; then
              echo "not gofmt-conforming: $file"
              exit 1
            fi
          done < <(git ls-files '*.go')
          python3 -c 'from pathlib import Path; text = Path("docs/IBM_I_VALIDATION.md").read_text(encoding="utf-8"); required = ["## Prerequisites", "## Binary and manifest verification", "## Manual validation checklist", "## Sanitized external evidence template", "## Abort and rollback", "ready_for_controlled_ibmi_validation", "not_validated_on_ibmi"]; forbidden = ["source text:", "host/user IDs:", "raw errors:", "commands:", "SQL:", "cursors:"]; assert all(marker in text for marker in required); assert not any(marker in text for marker in forbidden); assert "only exact recorded owned paths" in text; workflow = Path(".github/workflows/go-verification.yml").read_text(encoding="utf-8"); assert "git" + " ls-remote" not in workflow; assert "go test -tags=" + "ibmi_integration" not in workflow; assert "release_tag_pattern=" in workflow'

      - name: Verify offline handoff fixture assembly
        shell: bash
        run: |
          scripts/test-fetch-mapepire-2.3.6.sh
          scripts/test-package-handoff.sh

      - name: Fetch verified Mapepire release inputs
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/mapepire-2.3.6"
          rm -rf "$artifact_dir"
          scripts/fetch-mapepire-2.3.6.sh "$artifact_dir"

      - name: Build and verify handoff package
        shell: bash
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.0.0-ci.{0}', github.sha) }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf build/v1-mcp-foundation
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            IFS=/ read -r goos goarch <<< "$target"
            dir="build/v1-mcp-foundation/${VERSION}/${goos}-${goarch}"
            mkdir -p "$dir"
            binary="$dir/nexus"
            if [[ "$goos" == windows ]]; then binary+=".exe"; fi
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath -ldflags "-s -w -X main.releaseVersion=${VERSION} -X main.vcsRevision=${REVISION}" \
              -o "$binary" ./cmd/nexus
            go run ./cmd/release-manifest \
              -binary "$binary" \
              -manifest "$dir/nexus.manifest.json" \
              -version "$VERSION" \
              -revision "$REVISION" \
              -goos "$goos" \
              -goarch "$goarch"
           done
           if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
              artifact_dir="${RUNNER_TEMP}/mapepire-2.3.6"
              trap 'rm -rf "$artifact_dir"' EXIT
              scripts/package-handoff.sh "build/v1-mcp-foundation/${VERSION}" \
                "$artifact_dir/mapepire-server.jar" "$artifact_dir/mapepire-server-e39e54e7d3779ee513e0cab1f62acea095219c3b.tar.gz" \
                "$artifact_dir/LICENSE-GPL-3.0.txt" "build/nexus-${VERSION}-offline.zip"
           fi

      - name: Upload operator handoff package
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v1-mcp-foundation-${{ github.sha }}
          path: build/nexus-*-offline.zip*
          if-no-files-found: error

  profile-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify profile store and bundle resolver on Windows
        run: |
          go test -count=1 ./internal/profile
          go test -count=1 -run '^TestBundle' ./internal/configuration
      - name: Verify profile store vet on Windows
        run: go vet ./internal/profile
