name: Companion Windows Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-companion.yml
      - internal/connectors/ibmi/codefori/**
      - companion/vscode-codefori/**
      - go.mod
      - go.sum
  push:
    branches:
      - "**"
    paths:
      - .github/workflows/release-companion.yml
      - internal/connectors/ibmi/codefori/**
      - companion/vscode-codefori/**
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: companion-windows-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows:
    name: Native Windows descriptor validation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go CodeForI Windows consumer tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          go test -count=1 -timeout=2m ./internal/connectors/ibmi/codefori

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: companion/vscode-codefori/package-lock.json

      - name: Install Companion dependencies from the lockfile
        working-directory: companion/vscode-codefori
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          npm ci --no-audit --no-fund

      - name: Run opt-in native Windows token-store tests
        working-directory: companion/vscode-codefori
        shell: pwsh
        env:
          CODEFORI_WINDOWS_NATIVE_TESTS: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          npm test -- --run src/windows/tokenStore.windows.test.ts
