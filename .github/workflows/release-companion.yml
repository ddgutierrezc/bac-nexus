name: Companion Verification and Pre-release Publishing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-companion.yml
      - internal/connectors/ibmi/codefori/**
      - companion/vscode-codefori/**
      - go.mod
      - go.sum
  push:
    branches:
      - "**"
    tags:
      - "companion-v*"
    paths:
      - .github/workflows/release-companion.yml
      - internal/connectors/ibmi/codefori/**
      - companion/vscode-codefori/**
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run focused Go tests
        run: go test -count=1 ./internal/connectors/ibmi/codefori ./cmd/nexus

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: companion/vscode-codefori/package-lock.json

      - name: Install Companion dependencies from the lockfile
        working-directory: companion/vscode-codefori
        run: npm ci

      - name: Lint Companion
        working-directory: companion/vscode-codefori
        run: npm run lint

      - name: Typecheck Companion
        working-directory: companion/vscode-codefori
        run: npm run typecheck

      - name: Test Companion
        working-directory: companion/vscode-codefori
        run: npm test

      - name: Build Companion
        working-directory: companion/vscode-codefori
        run: npm run build

      - name: Verify release tag matches Companion version
        if: startsWith(github.ref, 'refs/tags/companion-v')
        working-directory: companion/vscode-codefori
        run: |
          tag_version="${GITHUB_REF_NAME#companion-v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            printf 'Release tag version %s does not match package version %s.\n' "$tag_version" "$package_version" >&2
            exit 1
          fi

      - name: Confirm no VSIX exists before packaging
        if: startsWith(github.ref, 'refs/tags/companion-v')
        working-directory: companion/vscode-codefori
        run: |
          shopt -s nullglob
          vsix_files=(*.vsix)
          if ((${#vsix_files[@]} != 0)); then
            printf 'Expected no VSIX files before packaging; found %d.\n' "${#vsix_files[@]}" >&2
            exit 1
          fi

      - name: Package Companion pre-release VSIX
        if: startsWith(github.ref, 'refs/tags/companion-v')
        working-directory: companion/vscode-codefori
        run: npm run package:vsix

      - name: Verify exactly one VSIX was packaged
        if: startsWith(github.ref, 'refs/tags/companion-v')
        id: packaged-vsix
        working-directory: companion/vscode-codefori
        run: |
          shopt -s nullglob
          vsix_files=(*.vsix)
          if ((${#vsix_files[@]} != 1)); then
            printf 'Expected exactly one packaged VSIX; found %d.\n' "${#vsix_files[@]}" >&2
            exit 1
          fi
          printf 'path=%s\n' "${vsix_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish Companion pre-release VSIX
        if: startsWith(github.ref, 'refs/tags/companion-v')
        working-directory: companion/vscode-codefori
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX_PATH: ${{ steps.packaged-vsix.outputs.path }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            printf 'VSCE_PAT repository secret is required for publishing.\n' >&2
            exit 1
          fi
          npx --yes @vscode/vsce@3.9.2 publish --pre-release --packagePath "$VSIX_PATH"
